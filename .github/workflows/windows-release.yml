name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated checks
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:lan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint

      - name: Build Windows installer
        run: npm run desktop:build -- --publish never

      - name: Audit public package
        run: npm run verify:public

      - name: Verify empty first launch and isolated desktop behavior
        run: |
          npx playwright test --config playwright.public.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:lan:browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run desktop:test

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResearchMind-Windows-x64
          path: release/ResearchMind-Setup-*.exe
          if-no-files-found: error

      - name: Upload failed UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ResearchMind-UI-diagnostics
          path: test-results/
          if-no-files-found: ignore

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem release/ResearchMind-Setup-*.exe).FullName --generate-notes --title "ResearchMind $env:GITHUB_REF_NAME"
